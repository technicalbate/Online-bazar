spring.application.name=Khojo
# Server Configuration
server.port=8081

# Email / SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
app.mail.from=${MAIL_FROM:noreply@mediaicon.local}

# SMS / Twilio Configuration
app.sms.enabled=${SMS_ENABLED:false}
app.sms.account-sid=${TWILIO_ACCOUNT_SID:}
app.sms.auth-token=${TWILIO_AUTH_TOKEN:}
app.sms.from-number=${TWILIO_FROM_NUMBER:}

# Database Configuration
# Use an in-memory H2 database by default so the app can run in clean environments without a local MySQL server.
# Override these values with environment variables (for example DB_URL, DB_USERNAME, DB_PASSWORD) as needed.
spring.datasource.url=${DB_URL:jdbc:h2:mem:khojo;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.database-platform=${JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.auth.admin-signup-code=${ADMIN_SIGNUP_CODE:}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# Python AI Service Configuration
app.ai.service.url=http://localhost:8000

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Multipart file upload limits
spring.servlet.multipart.max-file-size=5000MB
spring.servlet.multipart.max-request-size=5000MB
